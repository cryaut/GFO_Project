<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GFO Toolkit — Gestión Financiera Operativa</title>
  <meta name="description" content="Herramienta de gestión financiera operativa: presupuesto, estados financieros, análisis, activos, mercados.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="logo">GFO<span>Toolkit</span></h1>
      <p class="tagline">Datos. Cálculo. Decisión.</p>
    </div>
    <nav class="sidebar-nav" aria-label="Navegación principal">
      <a href="#/home" class="nav-link active" data-route="home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
      <p class="nav-section" id="nav-empresa">Empresa</p>
      <div class="nav-group" role="group" aria-labelledby="nav-empresa">
        <a href="#/estados" class="nav-link" data-route="estados">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Estados Financieros</span>
        </a>
        <a href="#/analisis" class="nav-link" data-route="analisis">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Análisis</span>
        </a>
        <a href="#/apalancamiento" class="nav-link" data-route="apalancamiento">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>

        </a>
        <a href="#/equilibrio" class="nav-link" data-route="equilibrio">

          <span>Punto de Equilibrio</span>

        <a href="#/flujo" class="nav-link" data-route="flujo">

          <span>Presupuesto Maestro</span>
        </a>
        <a href="#/inventario" class="nav-link" data-route="inventario">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          <span>Inventario</span>
        </a>
        <a href="#/proforma" class="nav-link" data-route="proforma">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
          <span>Proforma y Reporte</span>
        </a>
      </div>
      <p class="nav-section" id="nav-personal">Finanzas personales</p>
      <div class="nav-group" role="group" aria-labelledby="nav-personal">
        <a href="#/presupuesto" class="nav-link nav-link--personal" data-route="presupuesto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Presupuesto personal</span>
        </a>
        <a href="#/activos" class="nav-link nav-link--personal" data-route="activos">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <span>Activos del hogar</span>
        </a>
      </div>
      <p class="nav-section" id="nav-aprender">Aprender</p>
      <div class="nav-group" role="group" aria-labelledby="nav-aprender">
        <a href="#/mercados" class="nav-link" data-route="mercados">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>Mercados</span>
        </a>
        <a href="#/glosario" class="nav-link" data-route="glosario">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

        </a>
      </div>
      <p class="nav-section" id="nav-datos">Datos</p>

        <a href="#/reportes" class="nav-link" data-route="reportes">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Reportes</span>
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span>Tema</span>
      </button>
    </div>
  </aside>

  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <main class="main-content" id="app">
    <div class="page" id="page-home"></div>
    <div class="page page--personal" id="page-presupuesto"></div>
    <div class="page" id="page-estados"></div>
    <div class="page" id="page-analisis"></div>
    <div class="page page--personal" id="page-activos"></div>
    <div class="page" id="page-mercados"></div>
    <div class="page" id="page-reportes"></div>
    <div class="page" id="page-glosario"></div>
    <div class="page" id="page-apalancamiento"></div>
    <div class="page" id="page-inventario"></div>
    <div class="page" id="page-equilibrio"></div>
    <div class="page" id="page-flujo"></div>
    <div class="page" id="page-planeacion"></div>
    <div class="page" id="page-proforma"></div>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <div id="modal-overlay" class="modal-overlay hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
